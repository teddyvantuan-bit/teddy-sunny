<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Khách mời &amp; tạo lời mời | Văn Tuấn - Mỹ Dung</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  /* Layout: single scrolling column; sticky header with live counts; setup card, then two guest groups.
     Each guest: display name (Tên trên Thiệp, editable) -> live personal invite link + folksy-formal message.
     Palette: warm wine/rose on blush — mirrors the invite site's red accent. */
  :root{
    --bg:#fbf6f3; --surface:#ffffff; --surface-2:#fbf2ef; --surface-3:#f5e9e4;
    --ink:#2c2227; --muted:#8c7a80; --faint:#b3a3a8; --line:#ecded9;
    --accent:#b11a34; --accent-ink:#b11a34; --accent-soft:#f8e4e8;
    --ok:#2e7d57; --ok-soft:#e3f1ea;
    --wait:#a9701a; --wait-soft:#f6ecd9;
    --info:#365f93; --info-soft:#e4ecf6;
    --no:#9a9299; --no-soft:#efeaec;
    --warn:#c0491f; --warn-soft:#fbe7df;
    --radius:16px; --shadow:0 1px 2px rgba(60,30,40,.05),0 6px 20px rgba(120,50,70,.06);
    --disp:"Fraunces",Georgia,serif;
    --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#191114; --surface:#231a1e; --surface-2:#2b2025; --surface-3:#342529;
    --ink:#f2e8ea; --muted:#b29aa1; --faint:#7d6a71; --line:#3a2c31;
    --accent:#f08098; --accent-ink:#f6a0b5; --accent-soft:#3a2029;
    --ok:#73cda0; --ok-soft:#233830;
    --wait:#e2b566; --wait-soft:#39301d;
    --info:#8db4e3; --info-soft:#223246;
    --no:#9d9298; --no-soft:#2d2529;
    --warn:#f0a07d; --warn-soft:#3a241b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#191114; --surface:#231a1e; --surface-2:#2b2025; --surface-3:#342529;
    --ink:#f2e8ea; --muted:#b29aa1; --faint:#7d6a71; --line:#3a2c31;
    --accent:#f08098; --accent-ink:#f6a0b5; --accent-soft:#3a2029;
    --ok:#73cda0; --ok-soft:#233830;
    --wait:#e2b566; --wait-soft:#39301d;
    --info:#8db4e3; --info-soft:#223246;
    --no:#9d9298; --no-soft:#2d2529;
    --warn:#f0a07d; --warn-soft:#3a241b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:0 44px}

  header.top{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    margin-inline:-16px;padding:12px 16px 10px;
  }
  .top-row{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
  h1{font-family:var(--disp);font-weight:600;font-size:20px;margin:0;letter-spacing:.2px;text-wrap:balance}
  h1 .amp{color:var(--accent-ink);font-style:italic}
  .theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;width:34px;height:34px;flex:0 0 auto;cursor:pointer;font-size:15px}
  .stats{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .stat{display:flex;align-items:baseline;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--muted)}
  .stat b{font-weight:700;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
  .stat.hl b{color:var(--accent-ink)}

  section{margin-top:18px}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:600;margin:0 0 9px 2px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .setup .card{padding:4px 14px 12px}
  .fld{display:flex;flex-direction:column;gap:3px;padding-block:9px;border-bottom:1px solid var(--line)}
  .fld:last-child{border-bottom:0}
  .fld label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
  .fld input{border:0;background:transparent;color:var(--ink);font-family:var(--ui);font-size:15px;padding:2px 0;width:100%}
  .fld input.mono{font-family:var(--mono);font-size:12.5px}
  .fld input::placeholder{color:var(--faint)}
  .fld input:focus{outline:none}
  .fld.focus{box-shadow:inset 3px 0 0 var(--accent);margin-inline:-14px;padding-inline:14px;border-radius:2px}
  .sides{display:flex;gap:7px;flex-wrap:wrap;padding-block:11px 2px}
  .sides button{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:600 12.5px var(--ui);padding:7px 12px;border-radius:999px;cursor:pointer}
  .sides button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}

  .add{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;align-items:center}
  .add input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--ui);font-size:15px;padding:8px 6px}
  .add input:focus{outline:none}
  .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);font-family:var(--ui);font-weight:600;font-size:12.5px;padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .add-go{flex:0 0 auto;border:0;background:var(--accent);color:#fff;font:700 12px var(--ui);line-height:1.2;padding:0 14px;min-height:40px;border-radius:10px;cursor:pointer}
  .add-go:disabled{opacity:.4}
  @media(max-width:540px){.add{flex-wrap:wrap}.add input{flex-basis:calc(100% - 110px)}.add .seg{order:3;width:100%;justify-content:space-around}.add-go{order:2}}

  .grouphdr{display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
  .grouphdr .eyebrow{margin:0}
  .grouphdr .n{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
  .grouphdr .ln{flex:1;height:1px;background:var(--line)}

  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  li.guest{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 11px;display:flex;flex-direction:column;gap:8px}
  li.guest.sent{border-color:color-mix(in srgb,var(--accent) 24%,var(--line))}
  li.guest.dup{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
  .g-top{display:flex;align-items:center;gap:8px}
  .name-wrap{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .name-in{width:100%;border:1px solid transparent;background:var(--surface-2);color:var(--ink);font-family:var(--ui);font-weight:600;font-size:15px;padding:7px 10px;border-radius:9px}
  .name-in:focus{outline:none;border-color:var(--accent);background:var(--surface)}
  .fb{font-size:11px;color:var(--faint);padding-left:3px}
  .fb b{color:var(--muted);font-weight:600}
  .gpill{flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:600 11px var(--ui);padding:5px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .gpill.tl{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));background:var(--accent-soft)}
  .icon-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--faint);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
  .icon-btn:hover{color:var(--accent-ink)}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font:600 11px var(--ui);padding:3px 8px;border-radius:999px;display:inline-flex;gap:4px;align-items:center}
  .tag.addr{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
  .tag.plus{background:var(--info-soft);color:var(--info)}
  .tag.warn{background:var(--warn-soft);color:var(--warn)}

  .linkbar{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 6px 6px 10px}
  .linkbar code{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--accent-ink);font:600 11.5px var(--ui);padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .mini.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}

  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:600 12px var(--ui);padding:6px 10px;border-radius:999px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;user-select:none}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45}
  .chip.sent[data-on="1"]{background:var(--wait-soft);color:var(--wait);border-color:transparent}
  .chip.rep[data-on="1"]{background:var(--info-soft);color:var(--info);border-color:transparent}
  .chip[data-on="1"] .dot{opacity:1}
  .att{margin-left:auto;display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
  .att button{border:0;background:transparent;color:var(--muted);font:600 12px var(--ui);padding:5px 10px;border-radius:999px;cursor:pointer}
  .att button[aria-pressed="true"].yes{background:var(--ok-soft);color:var(--ok)}
  .att button[aria-pressed="true"].no{background:var(--no-soft);color:var(--no)}
  .msg-btn{width:100%;justify-content:center;border:1px solid color-mix(in srgb,var(--accent) 36%,var(--line));background:var(--accent-soft);color:var(--accent-ink);font:700 13.5px var(--ui);padding:10px;border-radius:10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:22px 16px;border:1px dashed var(--line);border-radius:14px}

  .tools{margin-top:26px;display:flex;flex-direction:column;gap:9px}
  .tool-btn{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13.5px var(--ui);padding:13px 15px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
  .tool-btn .ic{font-size:16px}
  .tool-btn .sub{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
  .tool-btn .tx{min-width:0}

  .note{text-align:center;color:var(--muted);font-size:11.5px;margin-top:16px;line-height:1.7}

  .scrim{position:fixed;inset:0;background:rgba(30,12,18,.5);backdrop-filter:blur(2px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--surface);width:100%;max-width:660px;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:rise .22s ease}
  @keyframes rise{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h2{font-family:var(--disp);font-weight:600;font-size:18px;margin:2px 0 3px}
  .sheet p.sub{color:var(--muted);font-size:12.5px;margin:0 0 12px;line-height:1.6}
  .sheet textarea{width:100%;min-height:190px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink);font-family:var(--ui);font-size:14.5px;line-height:1.6;padding:12px;resize:vertical}
  .sheet textarea.code{font-family:var(--mono);font-size:12px;min-height:200px;white-space:pre}
  .sheet .ready-link{display:block;margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--accent-ink);font:12px var(--mono);overflow-wrap:anywhere}
  .sheet-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .btn-primary{flex:1;min-width:150px;border:0;background:var(--accent);color:#fff;font:700 15px var(--ui);padding:13px;border-radius:12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;justify-content:center}
  .btn-primary.done{background:var(--ok)}
  .btn-sec{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 14px var(--ui);padding:13px 16px;border-radius:12px;cursor:pointer}
  .steps{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px;line-height:1.75}
  .steps code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--ink)}
  @media (min-width:560px){.scrim{align-items:center;padding:20px}.sheet{border-radius:20px}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <h1>Khách mời <span class="amp">&amp;</span> thiệp cưới</h1>
      <button class="theme-btn" id="themeBtn" title="Đổi nền sáng/tối" aria-label="Đổi nền sáng tối">◑</button>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="setup">
    <p class="eyebrow">Thiết lập chung</p>
    <div class="card">
      <div class="fld"><label>Lời mời từ (tên cô dâu &amp; chú rể — ký ở cuối tin)</label>
        <input id="ev-couple" placeholder="VD: Tuấn &amp; Linh"></div>
      <div class="fld"><label>Đường dẫn gốc của thiệp</label>
        <input id="ev-base" class="mono" placeholder="https://.../teddy-sunny/"></div>
      <div class="fld">
        <label>Ngày mời cho khách mới (hiện trong lời mời và chọn sẵn ở RSVP)</label>
        <div class="sides" id="sides">
          <button data-s="groom" aria-pressed="true">Nhà Trai · 25/10</button>
          <button data-s="bride" aria-pressed="false">Nhà Gái · 18/10</button>
          <button data-s="" aria-pressed="false">Không chọn bên</button>
        </div>
      </div>
    </div>
  </section>

  <section>
    <p class="eyebrow">Thêm khách mời</p>
    <div class="add">
      <input id="newName" placeholder="Tên trên thiệp (vd: Anh Pha)…" autocomplete="off">
      <div class="seg" id="newGroup">
        <button data-g="member" aria-pressed="true">Member</button>
        <button data-g="tl" aria-pressed="false">TL</button>
        <button data-g="other" aria-pressed="false">Cô</button>
      </div>
      <button class="add-go" id="addBtn" disabled>Tạo lời mời</button>
    </div>
  </section>

  <section id="listWrap"></section>

  <div class="tools">
    <button class="tool-btn" id="allMsgBtn"><span class="ic">💬</span><span class="tx">Xem / copy tất cả lời mời<span class="sub">Toàn bộ tin nhắn từng người để soát trước khi gửi</span></span></button>
    <button class="tool-btn" id="copyLinksBtn"><span class="ic">🔗</span><span class="tx">Copy tất cả tên + link<span class="sub">Dán vào Excel/Sheet hoặc Note để lưu</span></span></button>
    <button class="tool-btn" id="guestsJsBtn"><span class="ic">🧩</span><span class="tx">Lấy nội dung guests.js để đăng web<span class="sub">Tuỳ chọn: giúp link khách mới gọn hơn sau khi đăng</span></span></button>
    <button class="tool-btn" id="backupBtn"><span class="ic">⤓</span><span class="tx">Sao lưu / Khôi phục danh sách<span class="sub">Lưu một bản phòng khi đổi máy</span></span></button>
  </div>

  <p class="note">Danh sách lưu ngay trên thiết bị này — mở lại cùng đường link trên cùng máy là còn nguyên.<br>Tên trên thiệp quyết định cả link lẫn cách xưng hô trong tin nhắn — sửa là tự cập nhật.</p>
</div>

<div id="modalRoot"></div>

<script src="guests.js?v=20261012b"></script>
<script>
(function(){
  "use strict";
  var KEY="wedding_guestlist_v3";
  var DEFAULT_BASE="https://teddyvantuan-bit.github.io/teddy-sunny/";
  var state={event:{couple:"",base:DEFAULT_BASE,side:"groom"},guests:[]};
  var newGroup="member";
  function normalizeGuestSides(){state.guests.forEach(function(g){if(!Object.prototype.hasOwnProperty.call(g,'side'))g.side=state.event.side||'groom';});}

  function load(){
    try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.event&&Array.isArray(p.guests))return p;}}catch(e){}
    return null;
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

  var EXTRA_GUESTS=["cô My","cô Linh","cô Monica","Aunty Yun Yun","Aunty Henny","Pak Hengky","Farid","Hafiz","Aiman"];
  var saved=load();
  if(saved){
    state=saved; if(!state.event.base)state.event.base=DEFAULT_BASE;
    normalizeGuestSides();
    EXTRA_GUESTS.forEach(function(nm){
      if(!state.guests.some(function(g){return (g.name||"").trim().toLowerCase()===nm.toLowerCase();}))
        state.guests.push({id:uid(),fb:"",name:nm,group:"other",plus:false,sent:false,replied:false,att:"",side:state.event.side||'groom'});
    });
    save();
  }
  else{
    // [FB name, Tên trên Thiệp, group, plus]
    var SEED=[
      ["Dang Khoa Nguyen","Anh Pha","tl",true],
      ["Hoa Truong","Chị Bông","tl",true],
      ["Jane Nhat","Chị Nhật","tl",true],
      ["Kim Khánh","Chị Khánh","tl",true],
      ["Lani Hien Nguyen","Chị Lani","tl",true],
      ["Meegan Pham","Gia đình chị Meegan","tl",false],
      ["Nguyễn Quốc Thái","Anh Thái","tl",false],
      ["Nhat Nhat","","tl",false],
      ["Quỳnh Nguyễn","Gia đình chị Huỳnh","tl",false],
      ["Thi Doan","Anh chị Xy","tl",false],
      ["Thuật Huỳnh","Anh Kido","tl",false],
      ["Albert Nguyen","Albert Cu Sáng","member",false],
      ["Chuyen Dong","Em Chuyên","member",false],
      ["Dương Viết Hiếu","Em Hiếu","member",false],
      ["Giang Cao","Em Giang","member",false],
      ["Huyền Ngọc","Em Huyền","member",false],
      ["Huyen Trang Le","Chị Huyền Trang","member",false],
      ["Ky Duyen Nguyen","Chị Duyên","member",false],
      ["Lê Thanh Thảo","Em Thảo","member",false],
      ["Mỹ Duyên","Em Duyên","member",false],
      ["Ngọc Huyền","Em Huyền","member",false],
      ["Ngọc Nguyen","Chị Bee","member",true],
      ["Nguyệt Trần","Em Nguyệt","member",false],
      ["Nhẩn Thanh","Bạn Ken","member",false],
      ["Phạm Công Thành","Em Ben","member",false],
      ["Phương Nguyễn","Chị Phương","member",false],
      ["Trâm Huỳnh","Chị Trâm","member",false],
      ["Tran Thu Phuong","Em Phương","member",false],
      ["Út Nhỏ","Chị Út","member",false],
      ["Xuan Hong","Chị Hồng","member",false]
    ];
    state.guests=SEED.map(function(r){return {id:uid(),fb:r[0],name:r[1],group:r[2],plus:r[3],sent:false,replied:false,att:"",side:'groom'};});
    EXTRA_GUESTS.forEach(function(nm){state.guests.push({id:uid(),fb:"",name:nm,group:"other",plus:false,sent:false,replied:false,att:"",side:'groom'});});
    save();
  }

  // theme
  try{var t=localStorage.getItem(KEY+"_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}
  document.getElementById("themeBtn").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
    var next=dark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem(KEY+"_theme",next);}catch(e){}
  });

  // ---- slug + link (mirrors tao-link.html) ----
  function slugify(name){
    return String(name).toLowerCase().replace(/đ/g,'d').normalize('NFD')
      .replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-')
      .replace(/^-|-$/g,'').slice(0,60).replace(/-$/,'');
  }
  function buildDirectory(){
    var dir=Object.assign({},window.WEDDING_GUESTS||{});
    var map={};
    state.guests.forEach(function(g){
      var nm=(g.name||"").trim();
      if(!nm){map[g.id]="";return;}
      var stem=slugify(nm)||'khach-moi',slug=stem,suf=2;
      while(dir[slug]&&dir[slug]!==nm)slug=stem+'-'+(suf++);
      dir[slug]=nm;map[g.id]=slug;
    });
    return {dir:dir,map:map};
  }
  function encodeName(name){
    var bytes=new TextEncoder().encode(name),binary="";
    bytes.forEach(function(byte){binary+=String.fromCharCode(byte);});
    return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }
  function linkFor(slug,display,side){
    if(!slug)return "";
    var base=(state.event.base||DEFAULT_BASE).trim();
    var url;try{url=new URL(base);if(!/^https?:$/.test(url.protocol))throw Error('Invalid URL');}catch(e){url=new URL(DEFAULT_BASE);}
    url.searchParams.set('invite',slug);
    if((window.WEDDING_GUESTS||{})[slug]!==display)url.searchParams.set('n',encodeName(display));
    if(side==='bride'||side==='groom')url.searchParams.set('side',side);
    return url.href;
  }

  // ---- addressing derived from "Tên trên Thiệp" ----
  function parseAddr(display,group){
    var low=(display||"").trim().toLowerCase();
    if(/^cô/.test(low))return {self:"cháu",close:"cô",label:"cháu · cô"};
    if(/^aunty/.test(low))return {self:"con",close:"Aunty",label:"con · Aunty"};
    if(/^pak/.test(low))return {self:"con",close:"Pak",label:"con · Pak"};
    if(/^gia đình/.test(low))return {self:"em",close:"cả nhà",label:"em · cả nhà"};
    if(/^anh chị/.test(low))return {self:"em",close:"anh chị",label:"em · anh chị"};
    if(/^chị/.test(low))return {self:"em",close:"chị",label:"em · chị"};
    if(/^anh/.test(low))return {self:"em",close:"anh",label:"em · anh"};
    if(/^em/.test(low))return {self:"anh",close:"em",label:"anh · em"};
    if(/^bạn/.test(low))return {self:"mình",close:"bạn",label:"mình · bạn"};
    if(group==="tl")return {self:"em",close:"anh/chị",label:"em · anh/chị"};
    return {self:"mình",close:"bạn",label:"mình · bạn"};
  }
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

  function msgFor(display,group,link,plus,side){
    var V=(display||"").trim();
    var a=parseAddr(V,group);var S=a.self,C=a.close;
    var greet=V?("Chào "+V+","):("Chào "+C+",");
    var couple=(state.event.couple||"").trim()||"Văn Tuấn & Mỹ Dung";
    var dates=side==="bride"
      ? "Chủ Nhật, 18/10/2026 · tiệc lúc 10:00 tại Nhà Văn Hóa Thôn Tân Quý, Xã Chiên Đàn, TP. Đà Nẵng."
      : side==="groom"
        ? "Chủ Nhật, 25/10/2026 · tiệc lúc 10:00 tại gia đình nhà trai, TDP Tống Văn, P. Trần Lãm, Hưng Yên."
        : "Nhà gái: Chủ Nhật 18/10/2026 lúc 10:00 tại Nhà Văn Hóa Thôn Tân Quý, TP. Đà Nẵng. Nhà trai: Chủ Nhật 25/10/2026 lúc 10:00 tại TDP Tống Văn, P. Trần Lãm, Hưng Yên.";
    var parts=[
      greet,
      cap(S)+" thân mời "+C+(plus?" cùng gia đình":"")+" đến chung vui trong ngày cưới của "+couple+". Sự hiện diện của "+C+" là niềm vui lớn đối với hai gia đình.",
      dates,
      "Thiệp mời và thông tin chi tiết ở đây; "+C+" mở thiệp và xác nhận tham dự giúp "+S+" nhé:\n"+link,
      "Rất mong được gặp "+C+"! ❤️\n— "+couple
    ];
    return parts.join("\n\n");
  }

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  // duplicate display-name detection
  function dupSet(){
    var seen={},dup={};
    state.guests.forEach(function(g){var k=(g.name||"").trim().toLowerCase();if(!k)return;if(seen[k])dup[k]=true;seen[k]=true;});
    return dup;
  }

  // ---- stats ----
  function renderStats(){
    var g=state.guests,total=g.length;
    var sent=g.filter(function(x){return x.sent;}).length;
    var rep=g.filter(function(x){return x.replied;}).length;
    var yes=g.filter(function(x){return x.att==="yes";}).length;
    document.getElementById("stats").innerHTML=
      '<span class="stat hl"><b>'+sent+'</b>/'+total+' đã mời</span>'+
      '<span class="stat"><b>'+rep+'</b> đã rep</span>'+
      '<span class="stat"><b>'+yes+'</b> nhận dự</span>';
  }

  // ---- list ----
  var GROUPS=[{k:"member",label:"Team cũ · Member"},{k:"tl",label:"Đồng nghiệp · Team Leader"},{k:"other",label:"Cô · Khách quý"}];
  var curMap={};
  function renderList(){
    var built=buildDirectory();curMap=built.map;
    var dups=dupSet();
    var wrap=document.getElementById("listWrap");wrap.innerHTML="";
    GROUPS.forEach(function(grp){
      var items=state.guests.filter(function(x){return x.group===grp.k;});
      var hdr=document.createElement("div");hdr.className="grouphdr";
      hdr.innerHTML='<p class="eyebrow">'+grp.label+'</p><span class="n">'+items.length+'</span><span class="ln"></span>';
      wrap.appendChild(hdr);
      if(!items.length){
        var em=document.createElement("div");em.className="empty";
        em.textContent=grp.k==="member"?"Chưa có member nào.":(grp.k==="tl"?"Chưa có đồng nghiệp TL nào.":"Chưa có khách nào.");
        wrap.appendChild(em);return;
      }
      var ul=document.createElement("ul");ul.className="list";
      items.forEach(function(g){ul.appendChild(guestNode(g,dups));});
      wrap.appendChild(ul);
    });
  }
  function shortLink(link){return link?link.replace(/^https?:\/\//,''):"— chưa có tên thiệp —";}
  function guestNode(g,dups){
    var slug=curMap[g.id]||"";var link=linkFor(slug,g.name,g.side);
    var a=parseAddr(g.name,g.group);
    var li=document.createElement("li");li.className="guest"+(g.sent?" sent":"");
    var tags='<span class="tag addr">🗣 '+a.label+'</span>';
    tags+='<button class="tag addr" type="button" data-act="side" title="Đổi ngày mời">'+(g.side==='bride'?'🟢 Nhà Gái · 18/10':g.side==='groom'?'🔴 Nhà Trai · 25/10':'💌 Cả hai ngày')+'</button>';
    if(g.plus)tags+='<span class="tag plus">+ kèm gia đình</span>';
    if(!g.name)tags+='<span class="tag warn">⚠ chưa có tên thiệp</span>';
    li.innerHTML=
      '<div class="g-top">'+
        '<div class="name-wrap">'+
          '<input class="name-in" value="'+esc(g.name)+'" placeholder="Tên trên thiệp…" aria-label="Tên trên thiệp" spellcheck="false">'+
          '<span class="fb">FB: <b>'+esc(g.fb||"—")+'</b></span>'+
        '</div>'+
        '<button class="gpill'+(g.group!=="member"?" tl":"")+'" data-act="grp" title="Chạm để đổi nhóm">'+(g.group==="tl"?"TL":(g.group==="other"?"Cô":"Member"))+'</button>'+
        '<button class="icon-btn" data-act="del" title="Xoá">✕</button>'+
      '</div>'+
      '<div class="tags">'+tags+'</div>'+
      '<div class="linkbar"><code title="'+esc(link)+'">'+esc(shortLink(link))+'</code>'+
        '<button class="mini" data-act="copylink"'+(link?"":" disabled")+'>Copy link</button></div>'+
      '<div class="chips">'+
        '<button class="chip sent" data-act="sent" data-on="'+(g.sent?1:0)+'"><span class="dot"></span>Đã gửi</button>'+
        '<button class="chip rep" data-act="rep" data-on="'+(g.replied?1:0)+'"><span class="dot"></span>Đã rep</button>'+
        '<span class="att">'+
          '<button class="yes" data-act="yes" aria-pressed="'+(g.att==="yes")+'">Có dự</button>'+
          '<button class="no" data-act="no" aria-pressed="'+(g.att==="no")+'">Không</button>'+
        '</span>'+
      '</div>'+
      '<button class="msg-btn" data-act="msg">✍️ Copy lời mời (kèm link)</button>';

    var nameIn=li.querySelector(".name-in");
    nameIn.addEventListener("input",function(){g.name=nameIn.value;save();});
    nameIn.addEventListener("blur",function(){renderList();renderStats();});
    nameIn.addEventListener("keydown",function(e){if(e.key==="Enter")nameIn.blur();});

    li.addEventListener("click",function(ev){
      var b=ev.target.closest("[data-act]");if(!b)return;
      var act=b.getAttribute("data-act");
      if(act==="grp"){g.group=g.group==="member"?"tl":(g.group==="tl"?"other":"member");save();renderStats();renderList();return;}
      if(act==="side"){g.side=g.side==='groom'?'bride':g.side==='bride'?'':'groom';save();renderList();return;}
      if(act==="del"){state.guests=state.guests.filter(function(x){return x.id!==g.id;});save();renderStats();renderList();return;}
      if(act==="copylink"){var l=linkFor(curMap[g.id],g.name,g.side);if(l)copyText(l,b,"✓ Copy!");return;}
      if(act==="msg"){if(!(g.name||"").trim()){nameIn.focus();return;}openMsg(g);return;}
      if(act==="sent"){g.sent=!g.sent;}
      else if(act==="rep"){g.replied=!g.replied;}
      else if(act==="yes"){g.att=g.att==="yes"?"":"yes";}
      else if(act==="no"){g.att=g.att==="no"?"":"no";}
      save();renderStats();renderList();
    });
    return li;
  }

  // ---- add ----
  var nameInput=document.getElementById("newName"),addBtn=document.getElementById("addBtn");
  nameInput.addEventListener("input",function(){addBtn.disabled=!nameInput.value.trim();});
  nameInput.addEventListener("keydown",function(e){if(e.key==="Enter"&&nameInput.value.trim())doAdd();});
  document.querySelectorAll("#newGroup button").forEach(function(b){
    b.addEventListener("click",function(){
      newGroup=b.getAttribute("data-g");
      document.querySelectorAll("#newGroup button").forEach(function(x){x.setAttribute("aria-pressed",x===b);});
    });
  });
  addBtn.addEventListener("click",doAdd);
  function doAdd(){
    var n=nameInput.value.trim().slice(0,60);if(!n)return;
    var guest=state.guests.find(function(g){return (g.name||"").trim().toLowerCase()===n.toLowerCase();});
    if(!guest){
      guest={id:uid(),fb:"",name:n,group:newGroup,plus:false,sent:false,replied:false,att:"",side:state.event.side};
      state.guests.push(guest);
    } else guest.side=state.event.side;
    nameInput.value="";addBtn.disabled=true;nameInput.focus();
    save();renderStats();renderList();
    openMsg(guest);
  }

  // ---- setup fields ----
  var coupleIn=document.getElementById("ev-couple"),baseIn=document.getElementById("ev-base");
  coupleIn.value=state.event.couple||"";baseIn.value=state.event.base||DEFAULT_BASE;
  [coupleIn,baseIn].forEach(function(el){
    el.addEventListener("focus",function(){el.closest(".fld").classList.add("focus");});
    el.addEventListener("blur",function(){el.closest(".fld").classList.remove("focus");renderList();});
  });
  coupleIn.addEventListener("input",function(){state.event.couple=coupleIn.value;save();});
  baseIn.addEventListener("input",function(){state.event.base=baseIn.value;save();});
  document.querySelectorAll("#sides button").forEach(function(b){
    b.addEventListener("click",function(){
      state.event.side=b.getAttribute("data-s");
      document.querySelectorAll("#sides button").forEach(function(x){x.setAttribute("aria-pressed",x===b);});
      save();renderList();
    });
  });
  document.querySelectorAll("#sides button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-s")===(state.event.side||""));});

  // ---- modal ----
  var modalRoot=document.getElementById("modalRoot");
  function closeModal(){modalRoot.innerHTML="";}
  modalRoot.addEventListener("click",function(e){if(e.target.classList.contains("scrim"))closeModal();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
  function copyText(text,btn,doneLabel){
    function ok(){if(btn){var o=btn.innerHTML;btn.innerHTML=doneLabel||"✓ Đã copy!";btn.classList.add("ok");setTimeout(function(){btn.innerHTML=o;btn.classList.remove("ok");},1700);}}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok).catch(fb);}else{fb();}
    function fb(){var ta=document.querySelector(".sheet textarea");if(ta){ta.focus();ta.select();try{document.execCommand("copy");ok();}catch(e){}}}
  }

  function openMsg(g){
    var slug=curMap[g.id]||"";var link=linkFor(slug,g.name,g.side);
    var a=parseAddr(g.name,g.group);
    var scrim=document.createElement("div");scrim.className="scrim";
    scrim.innerHTML=
      '<div class="sheet" role="dialog" aria-modal="true">'+
        '<h2>Lời mời — '+esc(g.name||g.fb||"(chưa có tên)")+'</h2>'+
        '<p class="sub">Đã tạo lời mời và link dùng được ngay. Xưng hô: <b>'+a.label+'</b>. Bạn có thể sửa tin nhắn trước khi sao chép.</p>'+
        '<a class="ready-link" target="_blank" rel="noopener noreferrer"></a>'+
        '<textarea spellcheck="false"></textarea>'+
        '<div class="sheet-actions">'+
          '<button class="btn-primary" data-x="copy">📋 Copy lời mời + link</button>'+
          '<button class="btn-sec" data-x="copy-link">Copy link</button>'+
          '<button class="btn-sec" data-x="close">Đóng</button>'+
        '</div>'+
      '</div>';
    modalRoot.innerHTML="";modalRoot.appendChild(scrim);
    var aLink=scrim.querySelector('.ready-link');aLink.href=link;aLink.textContent=link||'Thêm tên trên thiệp để tạo link';
    var ta=scrim.querySelector("textarea");ta.value=msgFor(g.name,g.group,link,g.plus,g.side);
    scrim.querySelector('[data-x="close"]').addEventListener("click",closeModal);
    scrim.querySelector('[data-x="copy-link"]').addEventListener("click",function(){if(link)copyText(link,this,"✓ Đã copy link");});
    scrim.querySelector('[data-x="copy"]').addEventListener("click",function(){
      copyText(ta.value,this,"✓ Đã copy — dán vào Messenger nhé");
    });
  }

  function openTextSheet(title,sub,text,isCode){
    var scrim=document.createElement("div");scrim.className="scrim";
    scrim.innerHTML=
      '<div class="sheet" role="dialog" aria-modal="true">'+
        '<h2>'+esc(title)+'</h2><p class="sub">'+esc(sub)+'</p>'+
        '<textarea'+(isCode?' class="code"':'')+' spellcheck="false"></textarea>'+
        '<div class="sheet-actions">'+
          '<button class="btn-primary" data-x="copy">📋 Copy</button>'+
          '<button class="btn-sec" data-x="close">Đóng</button>'+
        '</div>'+
      '</div>';
    modalRoot.innerHTML="";modalRoot.appendChild(scrim);
    var ta=scrim.querySelector("textarea");ta.value=text;
    scrim.querySelector('[data-x="copy"]').addEventListener("click",function(){copyText(ta.value,this,"✓ Đã copy");});
    scrim.querySelector('[data-x="close"]').addEventListener("click",closeModal);
  }

  document.getElementById("allMsgBtn").addEventListener("click",function(){
    var built=buildDirectory();curMap=built.map;
    var blocks=state.guests.map(function(g){
      var l=linkFor(curMap[g.id],g.name,g.side);
      var a=parseAddr(g.name,g.group);
      var tag=(g.group==="tl"?"[TL] ":"[Member] ")+a.label+(g.plus?" · + gia đình":"");
      return "▸ "+(g.name||g.fb||"(chưa có tên)")+"  "+tag+"\n"+msgFor(g.name,g.group,l,g.plus,g.side);
    }).join("\n\n────────────\n\n");
    openTextSheet("Tất cả lời mời ("+state.guests.length+" người)","Mỗi khối là tin nhắn riêng của một người, đã kèm link. Copy từng khối để gửi, hoặc copy hết để soát / lưu.",blocks,false);
  });

  document.getElementById("copyLinksBtn").addEventListener("click",function(){
    var built=buildDirectory();curMap=built.map;
    var lines=state.guests.map(function(g){return (g.name||g.fb||"(chưa có tên)")+"\t"+(linkFor(curMap[g.id],g.name,g.side)||"(thiếu tên)");}).join("\n");
    openTextSheet("Tất cả tên + link","Dán vào Excel/Google Sheet (Tên [tab] Link) hoặc Note.",lines,false);
  });

  document.getElementById("guestsJsBtn").addEventListener("click",function(){
    var built=buildDirectory();
    var content="window.WEDDING_GUESTS = Object.freeze("+JSON.stringify(built.dir,null,2)+");\n";
    var scrim=document.createElement("div");scrim.className="scrim";
    scrim.innerHTML=
      '<div class="sheet" role="dialog" aria-modal="true">'+
        '<h2>Nội dung guests.js</h2>'+
        '<p class="sub">Link mới đã hoạt động. Đăng danh bạ này nếu bạn muốn rút gọn link, bỏ phần mã tên ở cuối. Làm theo 3 bước:</p>'+
        '<ol class="steps">'+
          '<li>Mở repo GitHub <code>teddy-sunny</code> → file <code>guests.js</code> → bấm ✏️ (Edit).</li>'+
          '<li>Xoá hết nội dung cũ, dán đoạn dưới vào, rồi Commit.</li>'+
          '<li>Đợi GitHub Pages cập nhật; sau đó tạo lại link để nhận bản ngắn hơn.</li>'+
        '</ol>'+
        '<textarea class="code" spellcheck="false" style="margin-top:12px"></textarea>'+
        '<div class="sheet-actions">'+
          '<button class="btn-primary" data-x="copy">📋 Copy guests.js</button>'+
          '<button class="btn-sec" data-x="close">Đóng</button>'+
        '</div>'+
      '</div>';
    modalRoot.innerHTML="";modalRoot.appendChild(scrim);
    var ta=scrim.querySelector("textarea");ta.value=content;
    scrim.querySelector('[data-x="copy"]').addEventListener("click",function(){copyText(ta.value,this,"✓ Đã copy guests.js");});
    scrim.querySelector('[data-x="close"]').addEventListener("click",closeModal);
  });

  document.getElementById("backupBtn").addEventListener("click",function(){
    var scrim=document.createElement("div");scrim.className="scrim";
    scrim.innerHTML=
      '<div class="sheet" role="dialog" aria-modal="true">'+
        '<h2>Sao lưu / Khôi phục</h2>'+
        '<p class="sub">Copy đoạn mã lưu vào Note. Khi đổi máy, dán lại rồi bấm Khôi phục.</p>'+
        '<textarea class="code" spellcheck="false"></textarea>'+
        '<div class="sheet-actions">'+
          '<button class="btn-primary" data-x="copy">📋 Copy bản sao lưu</button>'+
          '<button class="btn-sec" data-x="restore">↺ Khôi phục</button>'+
          '<button class="btn-sec" data-x="close">Đóng</button>'+
        '</div>'+
      '</div>';
    modalRoot.innerHTML="";modalRoot.appendChild(scrim);
    var ta=scrim.querySelector("textarea");ta.value=JSON.stringify(state);
    scrim.querySelector('[data-x="copy"]').addEventListener("click",function(){copyText(ta.value,this,"✓ Đã copy");});
    scrim.querySelector('[data-x="close"]').addEventListener("click",closeModal);
    scrim.querySelector('[data-x="restore"]').addEventListener("click",function(){
      try{var p=JSON.parse(ta.value);if(p&&p.event&&Array.isArray(p.guests)){state=p;if(!state.event.base)state.event.base=DEFAULT_BASE;normalizeGuestSides();save();syncInputs();renderStats();renderList();closeModal();}else{this.textContent="Dữ liệu không hợp lệ";}}
      catch(e){this.textContent="Mã không đọc được";}
    });
  });
  function syncInputs(){coupleIn.value=state.event.couple||"";baseIn.value=state.event.base||DEFAULT_BASE;document.querySelectorAll("#sides button").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-s")===(state.event.side||""));});}

  renderStats();renderList();
})();
</script>

</body></html>
